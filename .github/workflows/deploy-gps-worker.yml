name: Deploy GPS Worker

# Jalan otomatis tiap file di gps-worker/ berubah, atau tap "Run workflow" manual di tab Actions.
# Langkah: pasang ID D1 -> buat bucket R2 (bila belum ada) -> terapkan skema D1 -> deploy -> kirim secret.
on:
  workflow_dispatch:
  push:
    paths:
      - 'gps-worker/**'
      - '.github/workflows/deploy-gps-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang ID database D1 ke wrangler.toml
        working-directory: gps-worker
        env:
          D1_ID: ${{ secrets.GPS_D1_ID }}
        run: |
          if [ -z "$D1_ID" ]; then
            echo "::error::Secret GPS_D1_ID kosong. Buat database D1 'gps-db' di Cloudflare lalu simpan ID-nya sebagai secret GitHub GPS_D1_ID (lihat PANDUAN-GPS.md)."
            exit 1
          fi
          sed -i "s/GANTI_DENGAN_DATABASE_ID/$D1_ID/" wrangler.toml

      - name: Siapkan bucket R2 dan skema D1
        working-directory: gps-worker
        run: |
          npx --yes wrangler@3 r2 bucket create gps-audio || echo "Bucket gps-audio sudah ada (aman)."
          npx --yes wrangler@3 d1 execute gps-db --remote --file=schema.sql

      - name: Deploy Worker
        working-directory: gps-worker
        run: npx --yes wrangler@3 deploy

      # Secret dikirim satu per satu. Yang kosong DILEWATI (nilai lama di Cloudflare tidak dihapus). Nilai tidak pernah dicetak.
      - name: Kirim secret ke Cloudflare
        working-directory: gps-worker
        env:
          GPS_ACCOUNT: ${{ secrets.GPS_ACCOUNT }}
          GPS_PASSWORD: ${{ secrets.GPS_PASSWORD }}
          GPS_USER_ID: ${{ secrets.GPS_USER_ID }}
          GPS_APP_KEY: ${{ secrets.GPS_APP_KEY }}
          GPS_GOOGLE_CLIENT_ID: ${{ secrets.GPS_GOOGLE_CLIENT_ID }}
          GPS_OWNER_EMAILS: ${{ secrets.GPS_OWNER_EMAILS }}
          GPS_FAMILY_EMAILS: ${{ secrets.GPS_FAMILY_EMAILS }}
          GPS_VAPID_PUBLIC_KEY: ${{ secrets.GPS_VAPID_PUBLIC_KEY }}
          GPS_VAPID_PRIVATE_KEY: ${{ secrets.GPS_VAPID_PRIVATE_KEY }}
          GPS_SIGNING_SECRET: ${{ secrets.GPS_SIGNING_SECRET }}
          GPS_SIM_NUMBER: ${{ secrets.GPS_SIM_NUMBER }}
          GPS_CMD_PASSWORD: ${{ secrets.GPS_CMD_PASSWORD }}
          GPS_TOTP_SECRET: ${{ secrets.GPS_TOTP_SECRET }}
          GPS_SOS_PUSH_URL: ${{ secrets.GPS_SOS_PUSH_URL }}
          GPS_SOS_PUSH_KEY: ${{ secrets.GPS_SOS_PUSH_KEY }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx --yes wrangler@3 secret put "$1" > /dev/null && echo "OK   $1" || { echo "::error::Gagal mengirim secret $1"; exit 1; }
            else
              echo "skip $1 (kosong)"
            fi
          }
          put ACCOUNT          "$GPS_ACCOUNT"
          put PASSWORD         "$GPS_PASSWORD"
          put USER_ID          "$GPS_USER_ID"
          put APP_KEY          "$GPS_APP_KEY"
          put GOOGLE_CLIENT_ID "$GPS_GOOGLE_CLIENT_ID"
          put OWNER_EMAILS     "$GPS_OWNER_EMAILS"
          put FAMILY_EMAILS    "$GPS_FAMILY_EMAILS"
          put VAPID_PUBLIC_KEY "$GPS_VAPID_PUBLIC_KEY"
          put VAPID_PRIVATE_KEY "$GPS_VAPID_PRIVATE_KEY"
          put SIGNING_SECRET   "$GPS_SIGNING_SECRET"
          put SIM_NUMBER       "$GPS_SIM_NUMBER"
          put CMD_PASSWORD     "$GPS_CMD_PASSWORD"
          put TOTP_SECRET      "$GPS_TOTP_SECRET"
          put SOS_PUSH_URL     "$GPS_SOS_PUSH_URL"
          put SOS_PUSH_KEY     "$GPS_SOS_PUSH_KEY"
          for need in GPS_ACCOUNT GPS_PASSWORD GPS_USER_ID GPS_GOOGLE_CLIENT_ID GPS_OWNER_EMAILS GPS_SIGNING_SECRET; do
            if [ -z "${!need}" ]; then echo "::warning::Secret GitHub $need kosong. Pastikan nilainya sudah diset langsung di Cloudflare, atau isi di GitHub lalu jalankan ulang."; fi
          done
