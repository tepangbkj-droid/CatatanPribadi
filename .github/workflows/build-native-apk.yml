name: Build Native APK (lokasi di belakang layar)

# Jalankan manual dari tab Actions, atau otomatis kalau folder native/ berubah.
# Memakai secret keystore yang SAMA dengan build-apk.yml (KEYSTORE_PASSWORD, KEY_PASSWORD,
# ANDROID_KEYSTORE_BASE64) supaya APK ini bisa menimpa/meng-update versi TWA lama tanpa uninstall.
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          EXISTING_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING_KS" ]; then
            echo "$EXISTING_KS" | base64 -d > android.keystore
          else
            keytool -genkeypair -v -keystore android.keystore -alias bukukas \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Buku Kas, OU=App, O=Buku Kas, L=Jakarta, S=DKI Jakarta, C=ID"
            base64 -w0 android.keystore > SIMPAN-SEBAGAI-SECRET-ANDROID_KEYSTORE_BASE64.txt
            echo "::warning::Keystore baru dibuat. Simpan isi artifact keystore-backup sebagai secret ANDROID_KEYSTORE_BASE64."
          fi

      - name: Install dependensi Capacitor
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Buat project Android
        working-directory: native
        run: npx cap add android

      - name: Konfigurasi Firebase untuk push SOS
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > native/android/app/google-services.json
            echo "google-services.json terpasang"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON kosong - push SOS saat app tertutup tidak aktif."
          fi

      - name: Patch izin, versi, nama app
        working-directory: native
        run: python3 scripts/patch_android.py

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Ikon app dari icon-512.png
        working-directory: native/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; sz=${d##*:}
            mkdir -p mipmap-$n
            (command -v magick >/dev/null && magick "$GITHUB_WORKSPACE/icon-512.png" -resize ${sz}x${sz} mipmap-$n/ic_launcher.png) || convert "$GITHUB_WORKSPACE/icon-512.png" -resize ${sz}x${sz} mipmap-$n/ic_launcher.png
            cp mipmap-$n/ic_launcher.png mipmap-$n/ic_launcher_round.png
            rm -f mipmap-$n/ic_launcher_foreground.png
          done

      - name: Sinkronisasi plugin
        working-directory: native
        run: npx cap sync android

      - name: Build APK release
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Tanda tangani APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls native/android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias bukukas \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out buku-kas-native.apk aligned.apk
          "$BT/apksigner" verify buku-kas-native.apk

      - name: Cetak sidik jari (SHA-1 dan SHA-256) untuk Firebase
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "=== 1. Dari keystore ==="
          keytool -list -v -keystore android.keystore -storepass "$KS_PASS" || true
          echo "=== 2. Dari APK hasil build ==="
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs -v buku-kas-native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: buku-kas-native-apk
          path: buku-kas-native.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keystore-backup
          path: SIMPAN-SEBAGAI-SECRET-ANDROID_KEYSTORE_BASE64.txt
          if-no-files-found: ignore
          
