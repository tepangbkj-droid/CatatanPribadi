name: Build Android APK

# Jalankan otomatis kalau twa-manifest.json berubah, atau tap "Run workflow" manual di tab Actions.
on:
  workflow_dispatch:
  push:
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Arahkan Bubblewrap ke JDK & Android SDK bawaan runner
        run: bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      # Kalau secret ANDROID_KEYSTORE_BASE64 sudah ada, pakai keystore yang sama terus
      # (WAJIB supaya sha256_cert_fingerprints di assetlinks.json tetap cocok setiap build).
      # Kalau belum ada (build pertama kali), bikin keystore baru dan simpan salinannya
      # sebagai artifact — WAJIB kamu simpan sebagai secret baru setelah ini.
      - name: Siapkan signing keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          EXISTING_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING_KS" ]; then
            echo "$EXISTING_KS" | base64 -d > android.keystore
            echo "Pakai keystore yang sudah tersimpan di secret ANDROID_KEYSTORE_BASE64."
          else
            keytool -genkeypair -v -keystore android.keystore -alias bukukas \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Buku Kas, OU=App, O=Buku Kas, L=Jakarta, S=DKI Jakarta, C=ID"
            base64 -w0 android.keystore > SIMPAN-SEBAGAI-SECRET-ANDROID_KEYSTORE_BASE64.txt
            echo "::warning::Keystore baru dibuat. Download artifact 'keystore-backup', lalu simpan isinya sebagai secret ANDROID_KEYSTORE_BASE64, baru jalankan ulang workflow ini."
          fi

      - name: Generate project Android dari twa-manifest.json
        run: bubblewrap update --skipVersionUpgrade

      - name: Build APK yang sudah ditandatangani
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Generate assetlinks.json (biar tidak ada address bar)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PKG=$(node -e "console.log(require('./twa-manifest.json').packageId)")
          FPRINT=$(keytool -list -v -keystore android.keystore -alias bukukas -storepass "$KS_PASS" | awk -F': ' '/SHA256:/ {print $2; exit}')
          cat > assetlinks.json << EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "$PKG",
              "sha256_cert_fingerprints": ["$FPRINT"]
            }
          }]
          EOF
          cat assetlinks.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buku-kas-apk
          path: app-release-signed.apk

      - name: Upload assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: assetlinks.json

      - name: Upload backup keystore (hanya ada kalau baru dibuat)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keystore-backup
          path: SIMPAN-SEBAGAI-SECRET-ANDROID_KEYSTORE_BASE64.txt
          if-no-files-found: ignore
