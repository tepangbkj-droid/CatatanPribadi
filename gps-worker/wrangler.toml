# Alarm pemicu notifikasi: SOS_TYPE_IDS = SOS prioritas tertinggi; ALERT_TYPE_IDS = peringatan biasa
# (5 listrik terputus, 23 diderek, 38 perangkat dilepas, 48 cabut-colok). Kosongkan ALERT_TYPE_IDS untuk mematikan.
SOS_TYPE_IDS = "1"
ALERT_TYPE_IDS = "5,23,38,48"
ALERT_MAX_AGE_MIN = "15"
# Riwayat: jeda > HISTORY_GAP_SEC antar titik = blind spot; titik diunggah > HISTORY_LATE_SEC setelah waktu GPS = dikirim terlambat.
HISTORY_GAP_SEC = "300"
HISTORY_LATE_SEC = "120"
# Rentang panjang dipecah per jendela ini (jam) saat memanggil portal.
HISTORY_CHUNK_HOURS = "6"
# Putus BBM boleh dikirim anggota keluarga? ("0" = hanya pemilik)
FAMILY_CAN_COMMAND = "1"
VAPID_SUBJECT = "mailto:GANTI@email.kamu"
# Aplikasi Buku Kas lama membaca posisi memakai kunci x-api-key (hanya /pos /alarms /info, TIDAK untuk perintah).
# Setelah Anda masuk Google di halaman Pelacak Motor (sesi tersimpan), ubah ke "0" lalu deploy ulang. Lihat PANDUAN-GPS.md.
LEGACY_READ = "1"
# Templat perintah suara (sintaks beda antar firmware; cek buku manual CY06/GT06):
# CMD_RECORD_TEMPLATE  = "RECORD,{pw},{sec}#"
# CMD_MONITOR_TEMPLATE = "MONITOR,{pw}#"
# Bila endpoint portal berubah: CMD_CANDIDATES / HISTORY_CANDIDATES (JSON) menggantikan daftar bawaan.

# ---- SECRETS (jangan ditulis di sini; diisi dari GitHub Secrets oleh workflow) ----
#   ACCOUNT, PASSWORD, USER_ID                akun & objectid perangkat di CantrackPortal (PASSWORD juga dipakai membuktikan pemilik saat membuat kunci Authenticator)
#   GOOGLE_CLIENT_ID                          Client ID OAuth Web (xxxx.apps.googleusercontent.com); boleh beberapa, pisah koma
#   OWNER_EMAILS / FAMILY_EMAILS              email Google pemilik / keluarga, pisah koma
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY       pasangan kunci Web Push (cara membuat: PANDUAN-GPS.md)
#   SIGNING_SECRET                            (opsional) string acak panjang; bila kosong dibuat otomatis & disimpan di D1
#   SIM_NUMBER                                nomor SIM di tracker (tombol telepon)
#   TOTP_SECRET                               (opsional) kunci Authenticator manual. Bila kosong, kunci dibuat dari aplikasi (tab Kendaraan) dan disimpan di D1
#   CMD_PASSWORD                              (opsional) sandi perintah tracker; bawaan 123456. GANTI di tracker lalu isi di sini
#   APP_KEY                                   hanya untuk LEGACY_READ = "1"
#   WINDY_API_KEY                             (opsional) kunci Windy Webcams API v3 untuk GET /api/cctv (https://api.windy.com/keys). Tanpa ini hanya titik statis yang tampil
#   CCTV_EXTRA                                (opsional) JSON array titik CCTV tambahan (hls/portal), tanpa ubah kode
#   SOS_PUSH_URL, SOS_PUSH_KEY                (opsional) layanan FCM yang sudah ada (sos-push-gas.gs / sos-push-worker.js) agar SOS juga masuk ke APK
