name = "gps-worker"
main = "entry.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["*/1 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gps-db"
database_id = "GANTI_DENGAN_DATABASE_ID"

[vars]
ALLOW_ORIGIN = "*"
PORTAL_BASE = "https://www.cantrackportal.com"
WINDY_WEBCAMS_KEY = ""
CCTV_PROXY_HOSTS = "balitower.co.id,atcsindonesia.com,jakarta.go.id,bandung.go.id,surabaya.go.id,semarangkota.go.id,jogjakota.go.id,depok.go.id,bekasikota.go.id,tangerangkota.go.id,bogorkota.go.id,jasamarga.com,pu.go.id,dephub.go.id,molecool.id"

# Set lewat `wrangler secret put` atau GitHub Actions Secrets:
#   ACCOUNT, PASSWORD, IMEI, JWT_SECRET, GOOGLE_CLIENT_ID
