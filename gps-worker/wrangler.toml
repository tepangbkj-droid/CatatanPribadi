# Worker GPS (CantrackPortal) untuk Buku Kas + Pelacak Motor: posisi, riwayat rute, perintah (Google OAuth),
# push SOS (Web Push + FCM ke APK), rekaman suara, dan pemantau cron tiap menit.
# Dideploy otomatis oleh .github/workflows/deploy-gps-worker.yml (lihat PANDUAN-GPS.md).
name = "gps-worker"
main = "entry.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Cron: server memeriksa alarm/SOS tiap menit walau HP & aplikasi mati, sekaligus merekam posisi ke D1.
[triggers]
crons = ["* * * * *"]

# D1: sesi portal, langganan push, alarm yang sudah dikirim, posisi (riwayat), log perintah, metadata audio.
# database_id DIISI OTOMATIS oleh workflow dari secret GitHub GPS_D1_ID (jangan diubah manual di sini).
[[d1_databases]]
binding = "DB"
database_name = "gps-db"
database_id = "GANTI_DENGAN_DATABASE_ID"

# R2: file rekaman suara (dibuat otomatis oleh workflow bila belum ada).
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "gps-audio"

[vars]
# Asal (origin) yang boleh memanggil Worker. Harus persis origin GitHub Pages (tanpa path, tanpa garis miring akhir).
ALLOW_ORIGIN = "https://tepangbkj-droid.github.io"
TIMEZONE = "7"
IMEI = "868720062744036"
